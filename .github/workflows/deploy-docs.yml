name: Deploy docs

# Build the Astro + Starlight site in docs/ and publish it to the `gh-pages` branch
# (served at https://COMBINE-lab.github.io/oarfish/). Runs only when the docs
# sources actually change, and can also be triggered manually from the Actions
# tab ("Run workflow"). Pull requests that touch the docs build the site without
# publishing it, so a broken page is caught before merge.
#
# Branches: `dev` is the active integration branch where docs are edited; `main`
# is the default/release branch. Both publish to the same `gh-pages` site, so a
# push to whichever you treat as canonical wins. If you'd rather publish only
# release docs, drop `dev` from the list below.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# Allow the job to push the built site to the gh-pages branch via GITHUB_TOKEN.
permissions:
  contents: write

# Don't let concurrent runs race to publish gh-pages; cancel older in-flight runs.
concurrency:
  group: deploy-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      # Astro 7 needs Node.js 22.23.4 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # Replace the gh-pages branch with the built site (one commit, no history),
      # as `mkdocs gh-deploy --force --no-history` did. Adds .nojekyll, so Pages
      # serves Astro's `_astro/` assets.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
